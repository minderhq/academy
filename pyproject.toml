# PROJECT-OMEGA root manifest (uv-first; repo-manifest /1).
#
# The corpus itself is content, not an installable package - this
# manifest exists so the QA gate toolchain (scripts/qa/*) is
# reproducible: `uv sync --group qa` gives every contributor and the
# future platform build the exact environment the gates expect.
# requires-python follows the curriculum standard (3.13) so the repo
# practices what it teaches.

[project]
name = "project-omega"
version = "0.1.0"
description = "PROJECT-OMEGA curriculum corpus and its QA gate toolchain"
requires-python = ">=3.13"

[dependency-groups]
qa = ["httpx>=0.27"]

[tool.uv]
package = false
