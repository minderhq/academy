# Minder Academy root manifest (uv-first; repo-manifest /1).
#
# The curriculum remains content, not an installable library. The tiny
# `gh_slugify` build helper is installed editable so both `mkdocs.exe` and
# `python -m mkdocs` can resolve its YAML callable. This manifest also makes
# the QA gate toolchain reproducible: `uv sync --group qa` installs the
# offline-gate dependencies (PyYAML for the frontmatter/yaml parser gates,
# httpx for the network link tool). One exception: langchain_census (LC-01)
# resolves lesson imports against the kurulu-stack, so the full
# scorecard runs under that interpreter - see
# docs/00-META/ENVIRONMENT-SETUP.md. requires-python follows the
# curriculum standard (3.13) so the repo practices what it teaches.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-academy"
version = "0.1.0"
description = "Minder Academy curriculum corpus and its QA gate toolchain"
requires-python = ">=3.13"

[dependency-groups]
docs = ["mkdocs-material==9.7.7"]
qa = ["httpx>=0.27", "pyflakes>=3.0", "pyyaml>=6.0"]

[tool.setuptools]
py-modules = ["gh_slugify"]

[tool.uv]
package = true
