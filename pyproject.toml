# Minder Academy root manifest (uv-first; repo-manifest /1).
#
# The corpus itself is content, not an installable package - this
# manifest exists so the QA gate toolchain (scripts/qa/*) is
# reproducible: `uv sync --group qa` installs the offline-gate
# dependencies (PyYAML for the frontmatter/yaml parser gates, httpx
# for the network link tool). One exception: langchain_census (LC-01)
# resolves lesson imports against the kurulu-stack, so the full
# scorecard runs under that interpreter - see
# docs/00-META/ENVIRONMENT-SETUP.md. requires-python follows the
# curriculum standard (3.13) so the repo practices what it teaches.

[project]
name = "minder-academy"
version = "0.1.0"
description = "Minder Academy curriculum corpus and its QA gate toolchain"
requires-python = ">=3.13"

[dependency-groups]
qa = ["httpx>=0.27", "pyyaml>=6.0"]

[tool.uv]
package = false
