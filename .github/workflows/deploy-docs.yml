name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks.py"
      - "gh_slugify.py"
      - "README.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # GitHub Pages needs a public repository on the free plan. While the repo
  # is private this guard keeps the workflow green with the site deploy
  # skipped - unless a Pages site is already configured, which is the
  # paid-plan private case where deploys work and skipping would just
  # leave the live site stale. The live site's own Pages resource is the
  # source of truth: GET /pages 200 => deploy, 404 => the free-plan skip.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = "false" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          elif gh api "repos/${{ github.repository }}/pages" --jq .status >/dev/null 2>&1; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo is private but a Pages site is already configured - deploying."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo is private and has no Pages site - GitHub Pages requires public visibility on the free plan. Site deploy skipped until the flip."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.6,<10"

      - name: Build the site
        env:
          # gh_slugify (GitHub-accurate toc slugs) is a repo-local module
          # resolved by the !!python/name tag in mkdocs.yml
          PYTHONPATH: ${{ github.workspace }}
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: [guard, build]
    if: needs.guard.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
