# Environment Setup for RAG Notebooks (NB-601, NB-602, NB-603)
# Create conda environment: conda env create -f environment-rag.yml
# Update environment: conda env update -f environment-rag.yml
# Activate environment: conda activate academy-rag

name: academy-rag

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Python version (3.13 works too; 3.12 has the widest wheel coverage)
  - python=3.12

  # PyTorch ecosystem
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0

  # Core ML libraries
  - numpy=2.1.0
  - scipy=1.14.1
  - scikit-learn=1.6.0
  - pandas=2.2.3

  # Visualization
  - matplotlib=3.9.0
  - seaborn=0.13.2

  # Jupyter
  - jupyter=1.1.1
  - jupyterlab=4.3.0
  - ipykernel=6.29.5

  # Utilities
  - tqdm=4.67.0
  - requests=2.32.0
  - python-dotenv=1.0.1

  # Everything below via pip: the PyPI releases are the canonical
  # artifacts; conda builds of them lag behind
  - pip
  - pip:
      # Hugging Face embedding stack
      - transformers>=4.48
      - sentence-transformers>=3.3
      - datasets>=3.2

      # Vector databases
      - qdrant-client>=1.12
      - faiss-cpu>=1.9  # Use faiss-gpu for GPU support
      - chromadb>=0.6.0
      - pinecone>=5.0  # serverless client — the legacy pinecone-client<3
                       # name still installs but teaches the removed pod API
      - weaviate-client>=4.10  # v4 collections API (client.collections.*)

      # LLM frameworks
      - langchain>=1.0
      - langchain-text-splitters>=0.3
      - llama-index>=0.12

      # Web scraping
      - beautifulsoup4>=4.12
      - lxml>=5.3
      - html2text>=2024.4.15
      - trafilatura>=2.0

# Verification:
# After activation, verify installation:
#   python -c "import qdrant_client; print('Qdrant client OK')"
#   python -c "import sentence_transformers; print('Sentence transformers OK')"
#   python -c "import chromadb; print('ChromaDB OK')"

# Hardware Requirements:
# - CPU: 4+ cores recommended
# - RAM: 16GB+ recommended
# - GPU: Optional but recommended for embeddings
# - Storage: 50GB+ free space for vector databases

# Service Requirements:
# - Qdrant: docker run -p 6333:6333 qdrant/qdrant
# - ChromaDB: pip install chromadb (runs locally)
# - Neo4j (for GraphRAG): docker run -p 7474:7474 -p 7687:7687 neo4j:5-community

# Notes:
# - For production RAG, use dedicated vector database instances
# - For large-scale RAG, consider GPU-accelerated FAISS (faiss-gpu)
# - For GraphRAG, Neo4j is required (see 6301-Neo4j-and-Knowledge-Graphs.md)
