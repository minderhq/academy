# Environment Setup for PyTorch Notebooks (NB-201, NB-202)
# Create conda environment: conda env create -f environment-pytorch.yml
# Update environment: conda env update -f environment-pytorch.yml
# Activate environment: conda activate ai-engineering-curriculum-pytorch

name: ai-engineering-curriculum-pytorch

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # PyTorch ecosystem
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1  # Remove if no GPU available

  # Core ML libraries
  - numpy=1.24.0
  - scipy=1.11.0
  - scikit-learn=1.3.0
  - pandas=2.0.0

  # Visualization
  - matplotlib=3.7.0
  - seaborn=0.12.0
  - plotly=5.17.0

  # Jupyter
  - jupyter=1.0.0
  - jupyterlab=4.0.0
  - ipykernel=6.25.0
  - nbconvert=7.8.0
  - jupyter_contrib_nbextensions

  # Utilities
  - tqdm=4.66.0
  - pillow=10.0.0
  - requests=2.31.0

  # Development
  - pip
  - pip:
      - datasets>=2.14.0
      - transformers>=4.35.0
      - accelerate>=0.24.0

# Platform-specific dependencies
# For GPU support (NVIDIA):
#   - CUDA toolkit 12.1
#   - cuDNN 8.9
# Install via: conda install -c nvidia cuda-toolkit=12.1 cudnn=8.9

# Verification:
# After activation, verify installation:
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"
