# Environment Setup for PyTorch Notebooks (NB-201, NB-202)
# Create conda environment: conda env create -f environment-pytorch.yml
# Update environment: conda env update -f environment-pytorch.yml
# Activate environment: conda activate academy-pytorch

name: academy-pytorch

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Python version (3.13 works too; 3.12 has the widest wheel coverage)
  - python=3.12

  # PyTorch ecosystem
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0
  - pytorch-cuda=12.4  # Remove if no GPU available (CUDA runtime + cuDNN ship with these packages)

  # Core ML libraries
  - numpy=2.1.0
  - scipy=1.14.1
  - scikit-learn=1.6.0
  - pandas=2.2.3

  # Visualization
  - matplotlib=3.9.0
  - seaborn=0.13.2
  - plotly=5.24.0

  # Jupyter
  - jupyter=1.1.1
  - jupyterlab=4.3.0
  - ipykernel=6.29.5
  - nbconvert=7.16.0

  # Utilities
  - tqdm=4.67.0
  - pillow=11.0.0
  - requests=2.32.0

  # Development — HF ecosystem via pip: the PyPI releases are the
  # canonical artifacts; conda builds of them lag behind
  - pip
  - pip:
      - datasets>=3.2
      - transformers>=4.48
      - accelerate>=1.2

# Verification:
# After activation, verify installation:
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"
