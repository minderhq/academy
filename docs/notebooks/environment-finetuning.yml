# Environment Setup for Fine-Tuning Notebooks (NB-501, NB-502, NB-503)
# Create conda environment: conda env create -f environment-finetuning.yml
# Update environment: conda env update -f environment-finetuning.yml
# Activate environment: conda activate project-omega-finetuning

name: project-omega-finetuning

channels:
  - pytorch
  - huggingface
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # PyTorch ecosystem
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1  # Remove if no GPU available

  # Hugging Face ecosystem
  - transformers=4.35.0
  - peft=0.7.0  # LoRA, QLoRA
  - trl=0.7.0  # DPO training
  - datasets=2.14.0
  - accelerate=0.24.0
  - bitsandbytes=0.41.0  # 4-bit quantization

  # Training utilities
  - tensorboard=2.14.0
  - wandb=0.15.0

  # Core ML libraries
  - numpy=1.24.0
  - scipy=1.11.0
  - scikit-learn=1.3.0
  - pandas=2.0.0

  # Visualization
  - matplotlib=3.7.0
  - seaborn=0.12.0

  # Jupyter
  - jupyter=1.0.0
  - jupyterlab=4.0.0
  - ipykernel=6.25.0

  # Utilities
  - tqdm=4.66.0
  - pillow=10.0.0

  # Development
  - pip
  - pip:
      - deepspeed>=0.11.0  # Distributed training
      - torch-optimizer>=0.3.0

# Verification:
# After activation, verify installation:
#   python -c "import peft; print(f'PEFT: {peft.__version__}')"
#   python -c "import bitsandbytes; print(f'BitsAndBytes: {bitsandbytes.__version__}')"
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"

# Hardware Requirements:
# - CPU: 8+ cores recommended
# - RAM: 32GB+ recommended
# - GPU: 12GB+ VRAM required (for QLoRA fine-tuning of 7B models)
# - Storage: 100GB+ free space for models and datasets

# Notes:
# - For LoRA fine-tuning of 7B models: 12GB+ VRAM
# - For QLoRA fine-tuning of 7B models: 8GB+ VRAM
# - For fine-tuning of 13B+ models: 24GB+ VRAM
