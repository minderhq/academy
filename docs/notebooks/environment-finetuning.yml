# Environment Setup for Fine-Tuning Notebooks (NB-501, NB-502, NB-503)
# Create conda environment: conda env create -f environment-finetuning.yml
# Update environment: conda env update -f environment-finetuning.yml
# Activate environment: conda activate academy-finetuning

name: academy-finetuning

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Python version (3.13 works too; 3.12 has the widest wheel coverage)
  - python=3.12

  # PyTorch ecosystem
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0
  - pytorch-cuda=12.4  # Remove if no GPU available

  # Training utilities
  - tensorboard=2.18.0

  # Core ML libraries
  - numpy=2.1.0
  - scipy=1.14.1
  - scikit-learn=1.6.0
  - pandas=2.2.3

  # Visualization
  - matplotlib=3.9.0
  - seaborn=0.13.2

  # Jupyter
  - jupyter=1.1.1
  - jupyterlab=4.3.0
  - ipykernel=6.29.5

  # Utilities
  - tqdm=4.67.0
  - pillow=11.0.0

  # Development — HF fine-tuning stack via pip: the PyPI releases are the
  # canonical artifacts; conda builds of them lag behind
  - pip
  - pip:
      - transformers>=4.48
      - peft>=0.14  # LoRA, QLoRA
      - trl>=0.13  # SFT + DPO training
      - datasets>=3.2
      - accelerate>=1.2
      - bitsandbytes>=0.45  # 4-bit quantization
      - wandb>=0.19
      - deepspeed>=0.16  # Distributed training

# Verification:
# After activation, verify installation:
#   python -c "import peft; print(f'PEFT: {peft.__version__}')"
#   python -c "import bitsandbytes; print(f'BitsAndBytes: {bitsandbytes.__version__}')"
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"

# Hardware Requirements:
# - CPU: 8+ cores recommended
# - RAM: 32GB+ recommended
# - GPU: 12GB+ VRAM required (for LoRA fine-tuning of 7B models)
# - Storage: 100GB+ free space for models and datasets

# Notes:
# - For LoRA fine-tuning of 7B models: 12GB+ VRAM
# - For QLoRA fine-tuning of 7B models: 8GB+ VRAM
# - For fine-tuning of 13B+ models: 24GB+ VRAM
