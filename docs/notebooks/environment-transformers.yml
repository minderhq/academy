# Environment Setup for Transformer Notebooks (NB-301, NB-302, NB-303)
# Create conda environment: conda env create -f environment-transformers.yml
# Update environment: conda env update -f environment-transformers.yml
# Activate environment: conda activate academy-transformers

name: academy-transformers

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Python version (3.13 works too; 3.12 has the widest wheel coverage)
  - python=3.12

  # PyTorch ecosystem
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0
  - pytorch-cuda=12.4  # Remove if no GPU available

  # Core ML libraries
  - numpy=2.1.0
  - scipy=1.14.1
  - scikit-learn=1.6.0

  # Visualization
  - matplotlib=3.9.0
  - seaborn=0.13.2

  # Jupyter
  - jupyter=1.1.1
  - jupyterlab=4.3.0
  - ipykernel=6.29.5

  # Utilities
  - tqdm=4.67.0
  - pillow=11.0.0

  # Development — HF ecosystem via pip: the PyPI releases are the
  # canonical artifacts; conda builds of them lag behind
  - pip
  - pip:
      - transformers>=4.48
      - tokenizers>=0.21
      - accelerate>=1.2
      - datasets>=3.2
      - evaluate>=0.4.3
      - bertviz>=1.4.0
      # flash-attn: optional; wheels exist for Linux + CUDA only and the
      # build needs nvcc — skip on CPU-only machines

# Verification:
# After activation, verify installation:
#   python -c "import transformers; print(f'Transformers: {transformers.__version__}')"
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"

# Hardware Requirements:
# - CPU: 4+ cores recommended
# - RAM: 16GB+ recommended
# - GPU: 8GB+ VRAM recommended (for larger models)
