# Environment Setup for Transformer Notebooks (NB-301, NB-302, NB-303)
# Create conda environment: conda env create -f environment-transformers.yml
# Update environment: conda env update -f environment-transformers.yml
# Activate environment: conda activate ai-engineering-curriculum-transformers

name: ai-engineering-curriculum-transformers

channels:
  - pytorch
  - huggingface
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # PyTorch ecosystem
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1  # Remove if no GPU available

  # Hugging Face ecosystem
  - transformers=4.35.0
  - tokenizers=0.15.0
  - accelerate=0.24.0
  - datasets=2.14.0
  - evaluate=0.4.0

  # Core ML libraries
  - numpy=1.24.0
  - scipy=1.11.0
  - scikit-learn=1.3.0

  # Visualization
  - matplotlib=3.7.0
  - seaborn=0.12.0

  # Jupyter
  - jupyter=1.0.0
  - jupyterlab=4.0.0
  - ipykernel=6.25.0

  # Utilities
  - tqdm=4.66.0
  - pillow=10.0.0

  # Development
  - pip
  - pip:
      - bertviz>=1.4.0
      - flash-attn>=2.3.0  # Optional, for Flash Attention

# Verification:
# After activation, verify installation:
#   python -c "import transformers; print(f'Transformers: {transformers.__version__}')"
#   python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"

# Hardware Requirements:
# - CPU: 4+ cores recommended
# - RAM: 16GB+ recommended
# - GPU: 8GB+ VRAM recommended (for larger models)
