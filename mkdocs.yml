site_name: Minder Academy
site_description: A comprehensive, production-grade AI engineering curriculum - 7 phases, 33 modules, from GPU infrastructure to agentic systems.
site_url: https://minderkhq.github.io/academy/
repo_url: https://github.com/minderhq/academy
repo_name: minderkhq/academy
copyright: Copyright &copy; Minder Academy - MIT License

docs_dir: docs
site_dir: site

hooks:
  - hooks.py

# Corpus docs link to repo-root companion material (experiments/, configs/,
# README.md) that lives outside docs/. hooks.py copies it into site/ after
# the build, so these links resolve on the deployed site; mkdocs itself must
# not flag them, hence not_found stays at info (the QA fleet's linkcheck and
# casecheck remain the in-corpus link authority).
validation:
  links:
    not_found: info

theme:
  name: material
  language: en
  logo: material/school
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - navigation.expand
    - content.tabs.link

