site_name: Minder Academy
site_description: A comprehensive, production-grade AI engineering curriculum - 7 phases, 33 modules, from GPU infrastructure to agentic systems.
site_url: https://minderhq.github.io/academy/
repo_url: https://github.com/minderhq/academy
repo_name: minderhq/academy
# every page gets an "Edit on GitHub" pencil - the curriculum is MIT
# and readers who spot an error should be one click from a PR
edit_uri: edit/main/docs/
copyright: Copyright &copy; Minder Academy - MIT License

docs_dir: docs
site_dir: site

hooks:
  - hooks.py

# Corpus docs link to repo-root companion material (experiments/, configs/,
# README.md) that lives outside docs/. hooks.py copies it into site/ after
# the build, so these links resolve on the deployed site; mkdocs itself must
# not flag them, hence not_found stays at info (the QA fleet's linkcheck and
# casecheck remain the in-corpus link authority).
validation:
  links:
    not_found: info

theme:
  name: material
  # overrides/ carries the OpenGraph share-preview meta (main.html) -
  # Discord/Slack/X show a text preview instead of a bare URL; og:image
  # social cards stay out (cairosvg dependency in every build env)
  custom_dir: overrides
  language: en
  icon:
    # theme.logo takes a FILE path, not a built-in icon name - the old
    # "logo: material/school" shipped <img src=".../material/school"> which
    # 404s on every page, leaving the header without a logo (tick-815).
    # icon.logo accepts built-in icon names and inlines the SVG.
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    # progress bar on instant-navigation page loads - lesson pages are
    # large, the bar gives visible feedback between route swaps
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - content.tabs.link
    - navigation.path
    - header.autohide
    - content.code.select

