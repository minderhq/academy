# Explicit search plugin: stock-default config was the bare [\s\-]+ separator and
# stopWordFilter only, which tokenizes technical queries poorly ("torch.compile",
# "O(1)", "k3s" swallow punctuation) and has no stemming, so "containers" never
# matches "container". This is the separator/pipeline Material documents for
# English technical docs. Declaring plugins: replaces the implicit default set,
# and the only implicit default is search itself, so the surface is unchanged.
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&(?!\w)|[?]+(\s|$)'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer

  # Social cards: one branded PNG per page, wired to og:image /
  # twitter:image - the last missing piece of the share-preview stack
  # (og:title/og:description are per-page since the earlier head work,
  # og:image measured 0/442). Indigo background is the same brand value
  # the theme-color meta pins (primary: indigo in both schemes). Needs
  # pillow at build time: the deploy workflow installs
  # mkdocs-material[imaging].
  - social:
      cards: true
      cards_layout_options:
        background_color: "#3f51b5"
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - meta
  - toc:
      permalink: true
      slugify: !!python/name:gh_slugify.slugify
  - pymdownx.highlight:
      # line_spans deliberately ABSENT (tick-848): Material's copy button
      # does NOT need it - the 9.7.6 bundle mounts a .md-code__button on
      # every pre under content.code.copy alone, live-DOM-verified 94/94
      # on TUTORIAL-000 without any span wrapping (an early static grep for
      # the legacy .md-clipboard class false-alarmed here - buttons are
      # JS-injected, never in built HTML). content.code.select IS enabled
      # (features list) and works Range-based - selectNodeContents in the
      # 9.7.7 bundle - without any line spans; line_spans would only feed
      # per-line anchor permalinks, and wrapping every line cost +47KB
      # (+7.6%) on the heaviest page for zero visible change. (tick-912
      # config-usage census: anchor_linenums itself is currently dead
      # weight - zero linenums fences corpus-wide - kept as authoring
      # vocabulary, recorded not removed.)
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  # real checkboxes for the corpus's - [ ] progress/checkpoint lists
  # (PROGRESS-TRACKER alone carries 109 of them)
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - stylesheets/custom.css
# mermaid is Material's native integration on theme >= 9.6: the
# superfences custom_fences above is the entire setup - the theme loads
# and initializes mermaid itself, instant navigation included. A separate
# CDN <script> here would double-initialize every diagram.
extra_javascript:
  - stylesheets/ascii-fit.js
