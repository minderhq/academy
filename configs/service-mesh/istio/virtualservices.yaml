# PROJECT-OMEGA Istio Virtual Services and Gateways
# Traffic routing configuration for all services

# ============================================
# Gateway Configuration
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: project-omega-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP server (redirects to HTTPS)
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "omega.local"
        - "grafana.omega.local"
        - "prometheus.omega.local"
        - "vllm.omega.local"
        - "agent.omega.local"
      tls:
        httpsRedirect: true

    # HTTPS server
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "omega.local"
        - "grafana.omega.local"
        - "prometheus.omega.local"
        - "vllm.omega.local"
        - "agent.omega.local"
      tls:
        mode: SIMPLE
        credentialName: omega-tls
---
# ============================================
# Virtual Service: Grafana
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grafana
  namespace: project-omega
spec:
  hosts:
    - "grafana.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: grafana
            port:
              number: 3000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
---
# ============================================
# Virtual Service: Prometheus
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus
  namespace: project-omega
spec:
  hosts:
    - "prometheus.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: prometheus
            port:
              number: 9090
      timeout: 30s
---
# ============================================
# Virtual Service: vLLM
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vllm
  namespace: project-omega
spec:
  hosts:
    - "vllm.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    # API routes
    - match:
        - uri:
            prefix: /v1/
      route:
        - destination:
            host: vllm
            port:
              number: 8000
          subset: v1
          weight: 100
      timeout: 300s
      retries:
        attempts: 2
        perTryTimeout: 60s
      fault:
        delay:
          percentage:
            value: 0
          fixedDelay: 0s

    # Health check
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: vllm
            port:
              number: 8000
---
# ============================================
# Virtual Service: ReAct Agent
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: react-agent
  namespace: project-omega
spec:
  hosts:
    - "agent.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: react-agent
            port:
              number: 8000
      timeout: 600s
      retries:
        attempts: 1
        perTryTimeout: 300s
---
# ============================================
# Virtual Service: GraphRAG
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: graphrag
  namespace: project-omega
spec:
  hosts:
    - "graphrag.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: graphrag
            port:
              number: 8000
      timeout: 120s
---
# ============================================
# Destination Rule: vLLM
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vllm
  namespace: project-omega
spec:
  host: vllm
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        idleTimeout: 300s
    outlierDetection:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
---
# ============================================
# Destination Rule: Monitoring Services
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: monitoring
  namespace: project-omega
spec:
  host: grafana
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 50
---
# ============================================
# Service Entry: External APIs
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-llm-apis
  namespace: project-omega
spec:
  hosts:
    - "api.openai.com"
    - "huggingface.co"
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  resolution: DNS
---
# ============================================
# Authorization Policy: Deny All by Default
# ============================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: project-omega
spec:
  {}
---
# ============================================
# Authorization Policy: Allow Monitoring
# ============================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-monitoring
  namespace: project-omega
spec:
  selector:
    matchLabels:
      app: grafana
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "istio-system"
              - "project-omega"
---
# ============================================
# Authorization Policy: Allow LLM Services
# ============================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-llm-services
  namespace: project-omega
spec:
  selector:
    matchLabels:
      app: vllm
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/v1/*", "/health"]
    - from:
        - source:
            namespaces:
              - "project-omega"
              - "istio-system"
---
# ============================================
# Request Authentication: JWT
# ============================================
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: jwt-auth
  namespace: project-omega
spec:
  selector:
    matchLabels:
      app: react-agent
  jwtRules:
    - issuer: "https://omega.local/auth"
      jwks: "https://omega.local/auth/.well-known/jwks.json"
      forwardOriginalToken: true
---
# ============================================
# Peer Authentication: mTLS
# ============================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: project-omega
spec:
  mtls:
    mode: STRICT
---
# ============================================
# Rate Limiting: LLM Services
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: EnvoyFilter
metadata:
  name: vllm-rate-limit
  namespace: project-omega
spec:
  workloadSelector:
    labels:
      app: vllm
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: http_local_rate_limiter
            token_bucket:
              max_tokens: 100
              tokens_per_fill: 10
              fill_interval: 1s
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - header:
                  key: x-ratelimit-limit
                  value: "10"
                append: false
---
# ============================================
# Circuit Breaker: LLM Services
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vllm-circuit-breaker
  namespace: project-omega
spec:
  host: vllm
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http2MaxRequests: 10
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
        consecutiveGatewayFaults: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 40
---
# ============================================
# Traffic Shifting: A/B Testing
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vllm-ab-test
  namespace: project-omega
spec:
  hosts:
    - "vllm.omega.local"
  gateways:
    - istio-system/project-omega-gateway
  http:
    - match:
        - headers:
            x-user-group:
              exact: beta-testers
      route:
        - destination:
            host: vllm
            subset: v2
          weight: 100
    - route:
        - destination:
            host: vllm
            subset: v1
          weight: 90
        - destination:
            host: vllm
            subset: v2
          weight: 10
