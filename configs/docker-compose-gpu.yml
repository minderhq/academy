# PROJECT-OMEGA GPU Services Docker Compose Configuration
# For deployment on Proxmox VM with RTX 2080 Ti (11GB VRAM) via TB3 passthrough
# Network: 2.5Gbps Star Topology (192.168.1.x)
# GPU: RTX 2080 Ti (11GB VRAM)
#
# ⚠️ SECURITY WARNING: Before deploying to production:
# 1. Copy .env.example to .env
# 2. Change ALL default passwords in .env
# 3. Generate secure random passwords (use: openssl rand -base64 32)
# 4. Review security settings in configs/docs/ssl-tls-setup.md
# 5. Enable SSL/TLS for all services
# 6. Review firewall rules and network security

version: "3.8"

services:
  # ============================================
  # VLLM - High-Performance Inference Engine
  # ============================================
  vllm:
    image: vllm/vllm-openai:v0.4.0
    container_name: project-omega-vllm
    ports:
      - "8000:8000"
    environment:
      # Model configuration
      - MODEL=mistralai/Mistral-7B-Instruct-v0.2
      # Quantization for RTX 2080 Ti (11GB)
      - QUANTIZATION=awq
      - GPU_MEMORY_UTILIZATION=0.85
      - MAX_MODEL_LEN=8192
      # Tensor parallelism (single GPU)
      - TENSOR_PARALLEL_SIZE=1
      # Performance tuning
      - DTYPE=float16
      - MAX_NUM_SEQS=32
      - DISABLE_LOG_STATS=true
    volumes:
      - ./models:/models
      - ./data/vllm:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    networks:
      - project-omega-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    runtime: nvidia

  # ============================================
  # TGI - Text Generation Inference
  # ============================================
  tgi:
    # ⚠️ PIN SPECIFIC VERSION in production! Check https://github.com/huggingface/text-generation-inference/releases
    image: ghcr.io/huggingface/text-generation-inference:2.4.0
    container_name: project-omega-tgi
    ports:
      - "8080:80"
    environment:
      # Model configuration
      - MODEL_ID=mistralai/Mistral-7B-Instruct-v0.2
      # Quantization for RTX 2080 Ti (11GB)
      - QUANTIZE=awq
      # Context window
      - MAX_TOTAL_TOKENS=8192
      - MAX_INPUT_LENGTH=4096
      - MAX_BATCH_TOTAL_TOKENS=8192
      # Performance
      - CUDA_GRAPHS=1
      - PAGED_ATTENTION=1
      - FLASH_ATTENTION=1
      # API settings
      - DISABLE_CUSTOM_KV_TRANSFER=1
    volumes:
      - ./models:/models
      - ./data/tgi:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    networks:
      - project-omega-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    runtime: nvidia

  # ============================================
  # OLLAMA - Alternative LLM Server
  # ============================================
  ollama:
    # ⚠️ PIN SPECIFIC VERSION in production! Check https://github.com/ollama/ollama/releases
    image: ollama/ollama:0.5.7
    container_name: project-omega-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_LOAD_TIMEOUT=5m
      - OLLAMA_MAX_QUEUE=8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    networks:
      - project-omega-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    runtime: nvidia

  # ============================================
  # REACT AGENT - AI Agent Service
  # ============================================
  react-agent:
    build:
      context: ./services/react-agent
      dockerfile: Dockerfile
    container_name: project-omega-react-agent
    ports:
      - "8001:8000"
    environment:
      # Model settings
      - MODEL_NAME=mistralai/Mistral-7B-Instruct-v0.2
      - INFERENCE_ENGINE=vllm
      - INFERENCE_URL=http://vllm:8000
      # Agent settings
      - MAX_ITERATIONS=15
      - TEMPERATURE=0.7
      - TIMEOUT=300
      # Memory settings
      - MEMORY_TYPE=long_term
      - QDRANT_URL=http://192.168.1.100:6334
      - REDIS_URL=redis://192.168.1.100:6379
      # Neo4j for GraphRAG
      - NEO4J_URI=bolt://192.168.1.100:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=omega_change_me
      # Logging
      - LOG_LEVEL=INFO
      - ENABLE_TRACING=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://192.168.1.100:4317
    volumes:
      - ./data/agent:/data
      - ./services/react-agent/prompts:/app/prompts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
        limits:
          memory: 8G
    restart: unless-stopped
    networks:
      - project-omega-net
    depends_on:
      - vllm
    runtime: nvidia

  # ============================================
  # GRAPHRAG SERVICE - Knowledge Graph + Vector
  # ============================================
  graphrag-service:
    build:
      context: ./services/graphrag
      dockerfile: Dockerfile
    container_name: project-omega-graphrag
    ports:
      - "8002:8000"
    environment:
      # Vector database
      - QDRANT_URL=http://192.168.1.100:6334
      - QDRANT_COLLECTION=documents
      # Knowledge graph
      - NEO4J_URI=bolt://192.168.1.100:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=omega_change_me
      # Embeddings
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cuda
      # RAG settings
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=50
      - TOP_K=5
      - GRAPH_DEPTH=2
      - ALPHA=0.5
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - ./data/graphrag:/data
      - ./documents:/documents:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
        limits:
          memory: 4G
    restart: unless-stopped
    networks:
      - project-omega-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    runtime: nvidia

  # ============================================
  # NVIDIA GPU EXPORTER - GPU Metrics
  # ============================================
  gpu-exporter:
    image: mindprince/nvidia_gpu_exporter:1.1.0
    container_name: project-omega-gpu-exporter
    ports:
      - "9445:9445"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    restart: unless-stopped
    networks:
      - project-omega-net
    runtime: nvidia

networks:
  project-omega-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    external: false

volumes:
  vllm-data:
  tgi-data:
  ollama-data:
  agent-data:
  graphrag-data:
