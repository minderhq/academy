# Promtail Configuration for PROJECT-OMEGA
# Log collector for Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Positions file tracks where Promtail left off reading logs
positions:
  filename: /tmp/positions.yaml

# Loki client configuration
client:
  url: http://loki:3100/loki/api/v1/push

# Scrape configurations
scrape_configs:
  # Docker container logs
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      # Extract container image
      - source_labels: ['__meta_docker_container_image']
        regex: '(.*)'
        target_label: 'container_image'
      # Extract compose service and project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.*)'
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '(.*)'
        target_label: 'compose_project'
      # Set job name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.*)'
        replacement: '$1'
        target_label: job
      # Set instance label
      - replacement: 'synology-nas'
        target_label: instance
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            message: message
            timestamp: time
      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      # Parse common log formats
      - regex:
          expression: '^(?P<level>\w+)\s+(?P<message>.*)$'
      # Labels
      - labels:
          level:

  # System logs (syslog)
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system-logs
          __path__: /var/log/syslog
          instance: 'synology-nas'

  # Journal logs (systemd)
  - job_name: journal-logs
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        instance: 'synology-nas'
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__hostname']
        target_label: 'hostname'
      - source_labels: ['__journal_priority']
        target_label: 'priority'

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /var/log/nginx/access.log
          instance: 'synology-nas'
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[^ ]*) - (?P<remote_user>[^ ]*) \[(?P<time_local>[^\]]*)\] "(?P<method>[A-Z]+) (?P<path>[^ ]*) HTTP/(?P<http_version>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          method:
          status:
          remote_addr:

  # Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /var/log/nginx/error.log
          instance: 'synology-nas'
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: time
          format: '2006/01/02 15:04:05'

# Limits configuration
limits_config:
  # Maximum entry size
  entry_limit: 102400
  # Maximum line size
  line_limit: 102400
  # Maximum streams
  max_streams: 0
  # Maximum label value length
  max_label_value_length: 204
  # Maximum label name length
  max_label_name_length: 200
  # Ignore old streams
  ignore_old_stream: false
  # Use outgoing buffer
  use_outgoing_time: false

# Target configuration
target_config:
  # Sync period
  sync_period: 10s
