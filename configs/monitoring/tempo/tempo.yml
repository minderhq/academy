# Tempo Configuration for PROJECT-OMEGA
# Distributed tracing backend

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200
  grpc_listen_port: 9095

# Overrides the global setting for all traces.
overrides:
  # Metrics and usage
  metrics_generator_processors:
    - span-metrics
    - local-block-processor
  # Per-user ingestion rate limit
  ingestion_rate_mb: 32
  # Per-user burst ingestion rate
  ingestion_burst_mb: 64
  # Max search bytes per trace
  max_traces_per_user: 10000

# Distributor configuration
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Ingester configuration
ingester:
  # Trace idle time - after this time, a trace is flushed from the ingester
  trace_idle_period: 10s
  # The longest trace we'll accept before forcing a flush
  max_block_duration: 30s
  # Maximum memory bytes per block
  max_block_bytes: 20000000

# Compactor configuration
compactor:
  compaction:
    block_retention: 48h
    compacted_block_retention: 1h

# Storage configuration
storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

# Metrics generator configuration
metrics_generator:
  # Generate metrics from spans
  processor:
    # Service graph metrics
    service_graph:
      # Maximum depth of service graph
      depth: 4
      # Metrics to generate
      dimensions:
        - service_name
        - operation_name
        - span_kind
      # Use histogram for quantiles
      histogram: true
      # Histogram buckets in seconds
      histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
    # Span metrics
    span_metrics:
      # Dimensions to add to metrics
      dimensions:
        - http.method
        - http.status_code
        - http.url
        - net.peer.name
        - db.system
        - db.name
        - db.operation
    # Local block processor
    local_blocks:
      # Filter to apply
      filter_serverless_enabled: true

# Search configuration
search:
  # External endpoint for searching traces
  external_endpoints:
    - http://tempo-gateway-router:3200

# Memberlist configuration for clustering (optional)
# memberlist:
#   bind_addr: [::]
#   join_members:
#     - tempo-1:7946
#     - tempo-2:7946
#     - tempo-3:7946

# Traces configuration
traces:
  # Sample rate (1.0 = 100%)
  # Adjust based on traffic volume
  sampler_type: probabilistic
  sampler_param: 0.1
