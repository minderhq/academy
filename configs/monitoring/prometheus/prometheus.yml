# Prometheus Configuration for PROJECT-OMEGA
# Global settings
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'project-omega'
    environment: 'homelab'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Container metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'synology-nas'

  # System metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'synology-nas'

  # GPU metrics (GPU Exporter on GPU VM)
  - job_name: 'gpu-exporter'
    static_configs:
      - targets: ['192.168.1.50:9445']  # Update with GPU VM IP
        labels:
          instance: 'proxmox-gpu-vm'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: 'synology-nas'

  # Qdrant metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6334']
        labels:
          instance: 'synology-nas'
    metrics_path: '/metrics'

  # Neo4j metrics
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']
        labels:
          instance: 'synology-nas'

  # vLLM metrics (from GPU VM)
  - job_name: 'vllm'
    static_configs:
      - targets: ['192.168.1.50:8000']  # Update with GPU VM IP
        labels:
          instance: 'proxmox-gpu-vm'
    metrics_path: '/metrics'

  # TGI metrics (from GPU VM)
  - job_name: 'tgi'
    static_configs:
      - targets: ['192.168.1.50:80']  # Update with GPU VM IP
        labels:
          instance: 'proxmox-gpu-vm'
    metrics_path: '/metrics'

  # ReAct Agent metrics
  - job_name: 'react-agent'
    static_configs:
      - targets: ['192.168.1.50:8001']  # Update with GPU VM IP
        labels:
          instance: 'proxmox-gpu-vm'
    metrics_path: '/metrics'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'synology-nas'

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://thanos-receiver:19291/api/v1/receive"
