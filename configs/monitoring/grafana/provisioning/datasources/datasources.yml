# Grafana Datasources Provisioning Configuration

apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST

  # Loki - Logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "(?:trace_id|traceId|traceID)=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"

  # Tempo - Traces
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: POST
      tracesToLogs:
        datasourceUid: loki
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true

  # Redis
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis:6379
    editable: true
    jsonData:
      client: standalone
      pool: 2
      tlsSkipVerify: true

  # Neo4j (requires plugin)
  - name: Neo4j
    type: neo4j-datasource
    access: proxy
    url: http://neo4j:7474
    editable: true
    jsonData:
      neo4jUri: bolt://neo4j:7687
      username: neo4j
      password: omega_change_me

  # Qdrant
  - name: Qdrant
    type: prometheus
    access: proxy
    url: http://qdrant:6334/metrics
    editable: true
    jsonData:
      timeInterval: 30s
