# PROJECT-OMEGA API Gateway Configuration
# Nginx as reverse proxy for all services

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events configuration
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# HTTP configuration
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream definitions
    upstream qdrant_http {
        server qdrant:6334;
        keepalive 32;
    }

    upstream neo4j_http {
        server neo4j:7474;
        keepalive 32;
    }

    upstream grafana {
        server grafana:3000;
        keepalive 32;
    }

    upstream prometheus {
        server prometheus:9090;
        keepalive 32;
    }

    upstream loki {
        server loki:3100;
        keepalive 32;
    }

    upstream tempo {
        server tempo:3200;
        keepalive 32;
    }

    upstream portainer {
        server portainer:9000;
        keepalive 32;
    }

    upstream dozzle {
        server dozzle:8080;
        keepalive 32;
    }

    # GPU VM upstreams (cross-network)
    upstream vllm {
        server 192.168.1.50:8000;
        keepalive 16;
    }

    upstream tgi {
        server 192.168.1.50:8080;
        keepalive 16;
    }

    upstream ollama {
        server 192.168.1.50:11434;
        keepalive 16;
    }

    upstream react_agent {
        server 192.168.1.50:8001;
        keepalive 16;
    }

    upstream graphrag {
        server 192.168.1.50:8002;
        keepalive 16;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Main server block
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Protector "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS (uncomment after SSL setup)
        # return 301 https://$host$request_uri;
    }

    # HTTPS server block
    # server {
    #     listen 443 ssl http2;
    #     server_name omega.local;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Include location blocks from conf.d
    #     include /etc/nginx/conf.d/*.conf;
    # }
}

# Stream configuration (for TCP/UDP proxying)
stream {
    # Neo4j Bolt protocol
    upstream neo4j_bolt {
        server neo4j:7687;
    }

    # Qdrant gRPC
    upstream qdrant_grpc {
        server qdrant:6333;
    }

    # Redis
    upstream redis {
        server redis:6379;
    }

    # Neo4j Bolt proxy
    server {
        listen 7687;
        proxy_pass neo4j_bolt;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }

    # Qdrant gRPC proxy
    server {
        listen 6333;
        proxy_pass qdrant_grpc;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }
}
