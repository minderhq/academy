# ============================================
# API ROUTING
# ============================================

# Unified API gateway
location /api/ {
    # API routing based on path
    # /api/v1/ -> vLLM
    # /api/chat/ -> ReAct Agent
    # /api/rag/ -> GraphRAG
    # /api/vector/ -> Qdrant
    # /api/graph/ -> Neo4j

    # Return 404 for unknown routes
    return 404 '{"error":"Unknown API endpoint"}';
    add_header Content-Type application/json;
}

# Health check endpoint
location /health {
    access_log off;
    return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
    add_header Content-Type application/json;
}

# ============================================
# WEBHOOKS AND INTEGRATIONS
# ============================================

# GitHub webhook (for CI/CD)
location /webhook/github/ {
    proxy_pass http://192.168.1.50:9000/hooks/github;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-GitHub-Event $http_github_event;
    proxy_set_header X-Hub-Signature $http_x_hub_signature;
}

# Generic webhook
location /webhook/ {
    proxy_pass http://192.168.1.50:9000/hooks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Webhook-Source $http_x_webhook_source;
}
