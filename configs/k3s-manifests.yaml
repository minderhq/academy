# PROJECT-OMEGA K3s Manifests
# For deployment on K3s cluster (Proxmox LXC + NUC)

# ============================================
# Namespace
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: project-omega
  labels:
    name: project-omega

---
# ============================================
# Storage Class for NFS (Synology)
# ============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-synology
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.100
  share: /volume1/k8s
  # Delete on PVC removal
  archiveOnDelete: "false"
volumeBindingMode: Immediate
reclaimPolicy: Delete
allowVolumeExpansion: true

---
# ============================================
# ConfigMap: Model Configuration
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: project-omega
data:
  MODEL_NAME: "mistralai/Mistral-7B-Instruct-v0.2"
  TENSOR_PARALLEL_SIZE: "1"
  MAX_MODEL_LEN: "4096"
  GPU_MEMORY_UTILIZATION: "0.9"
  DTYPE: "half"

---
# ============================================
# Deployment: vLLM Inference Server
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: project-omega
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      # GPU node selector
      nodeSelector:
        gpu: "true"
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.6.post1  # ⚠️ PIN SPECIFIC VERSION in production!
        # Check https://github.com/vllm-project/vllm/releases for latest stable version
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL
          valueFrom:
            configMapKeyRef:
              name: model-config
              key: MODEL_NAME
        - name: TENSOR_PARALLEL_SIZE
          valueFrom:
            configMapKeyRef:
              name: model-config
              key: TENSOR_PARALLEL_SIZE
        - name: MAX_MODEL_LEN
          valueFrom:
            configMapKeyRef:
              name: model-config
              key: MAX_MODEL_LEN
        - name: GPU_MEMORY_UTILIZATION
          valueFrom:
            configMapKeyRef:
              name: model-config
              key: GPU_MEMORY_UTILIZATION
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "12Gi"
          requests:
            nvidia.com/gpu: "1"
            memory: "8Gi"
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc

---
# ============================================
# Service: vLLM
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: project-omega
spec:
  selector:
    app: vllm-inference
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

---
# ============================================
# Ingress: vLLM
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress
  namespace: project-omega
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
  - host: llm.project-omega.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vllm-inference
            port:
              number: 8000

---
# ============================================
# PVC: Model Cache
# ============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: project-omega
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-synology
  resources:
    requests:
      storage: 50Gi

---
# ============================================
# Deployment: Qdrant (if running on K3s)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: project-omega
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: grpc
        - containerPort: 6334
          name: http
        env:
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6333"
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6334"
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
          requests:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-pvc

---
# ============================================
# Service: Qdrant
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: project-omega
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333
    name: grpc
  - port: 6334
    targetPort: 6334
    name: http
  type: ClusterIP

---
# ============================================
# PVC: Qdrant Storage
# ============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: project-omega
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-synology
  resources:
    requests:
      storage: 100Gi

---
# ============================================
# DaemonSet: NVIDIA GPU Operator
# ============================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: project-omega
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.14.0
        name: nvidia-device-plugin
        env:
        - name: FAIL_ON_INIT_ERROR
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      nodeSelector:
        gpu: "true"

---
